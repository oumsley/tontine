version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bingmoney
      POSTGRES_PASSWORD: bingmoney
      POSTGRES_DB: bingmoney
    ports:
      - "5432:5432"
    volumes:
      - bingmoney-postgres:/var/lib/postgresql/data

volumes:
  bingmoney-postgres:
